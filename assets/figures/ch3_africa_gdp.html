<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Africa GDP Evolution</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0d0b18;
      color: #f1f0eb;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    }
    .frame {
      width: min(100%, 960px);
      padding: 18px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.05rem;
      letter-spacing: 0.01em;
    }
    .subtitle {
      margin: 0 0 14px;
      font-size: 0.9rem;
      color: #b7b2a3;
      line-height: 1.5;
    }
    .chart {
      width: 100%;
      height: 420px;
      position: relative;
    }
    .year-label {
      position: absolute;
      right: 16px;
      top: 16px;
      font-size: 0.9rem;
      color: #e6d8a8;
      background: rgba(0,0,0,0.25);
      padding: 6px 10px;
      border-radius: 4px;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
      font-size: 0.82rem;
      color: #dad4c4;
    }
    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .legend .marker {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      display: inline-block;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
</head>
<body>
  <div class="frame">
    <h1>GDP evolution animation — Africa</h1>
    <p class="subtitle">This animated line chart shows GDP per capita evolution for selected African economies from 1960 to 2007.</p>
    <div class="chart" id="chart"></div>
    <div class="legend" id="legend"></div>
  </div>
  <script>
    const data = [
      { name: 'Nigeria', color: '#7fc97f', values: [
          {year:1960,value:1077},{year:1970,value:1470},{year:1980,value:2100},{year:1990,value:1600},{year:2000,value:1700},{year:2007,value:2014}
      ] },
      { name: 'South Africa', color: '#beaed4', values: [
          {year:1960,value:2500},{year:1970,value:3200},{year:1980,value:4200},{year:1990,value:5200},{year:2000,value:5400},{year:2007,value:6200}
      ] },
      { name: 'Egypt', color: '#fdc086', values: [
          {year:1960,value:800},{year:1970,value:1200},{year:1980,value:1400},{year:1990,value:1700},{year:2000,value:1900},{year:2007,value:2400}
      ] },
      { name: 'Kenya', color: '#386cb0', values: [
          {year:1960,value:300},{year:1970,value:400},{year:1980,value:450},{year:1990,value:500},{year:2000,value:700},{year:2007,value:900}
      ] }
    ];

    const margin = { top: 28, right: 28, bottom: 32, left: 48 };
    const container = document.getElementById('chart');
    const width = container.clientWidth;
    const height = container.clientHeight;
    const svg = d3.select('#chart').append('svg')
      .attr('width', width)
      .attr('height', height);

    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;
    const maxValue = d3.max(data, series => d3.max(series.values, d => d.value));

    const x = d3.scaleLinear()
      .domain([1960, 2007])
      .range([0, innerWidth]);

    const y = d3.scaleLinear()
      .domain([0, maxValue * 1.05])
      .range([innerHeight, 0]);

    const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

    g.append('g')
      .attr('transform', `translate(0,${innerHeight})`)
      .call(d3.axisBottom(x).ticks(6).tickFormat(d3.format('d')))
      .attr('color', '#b7b2a3');

    g.append('g')
      .call(d3.axisLeft(y).ticks(6).tickFormat(d => '$' + d3.format(',')(d)))
      .attr('color', '#b7b2a3');

    const line = d3.line()
      .x(d => x(d.year))
      .y(d => y(d.value))
      .curve(d3.curveMonotoneX);

    const yearLabel = document.createElement('div');
    yearLabel.className = 'year-label';
    yearLabel.textContent = '1960';
    container.appendChild(yearLabel);

    const paths = g.selectAll('.series')
      .data(data)
      .join('g')
      .attr('class', 'series')
      .append('path')
      .attr('d', d => line(d.values))
      .attr('fill', 'none')
      .attr('stroke', d => d.color)
      .attr('stroke-width', 3)
      .attr('stroke-linecap', 'round')
      .attr('stroke-linejoin', 'round');

    paths.each(function() {
      const path = d3.select(this);
      const totalLength = this.getTotalLength();
      path.attr('stroke-dasharray', totalLength + ' ' + totalLength)
          .attr('stroke-dashoffset', totalLength)
          .transition()
          .duration(2200)
          .ease(d3.easeCubic)
          .attr('stroke-dashoffset', 0);
    });

    data.forEach(series => {
      const item = document.createElement('span');
      item.innerHTML = `<span class="marker" style="background:${series.color}"></span>${series.name}`;
      document.getElementById('legend').appendChild(item);
    });

    const focus = g.append('g');
    focus.selectAll('circle')
      .data(data)
      .join('circle')
      .attr('r', 4)
      .attr('fill', d => d.color)
      .attr('opacity', 0.9);

    const allYears = [1960, 1970, 1980, 1990, 2000, 2007];
    let step = 0;
    d3.interval(() => {
      if (step >= allYears.length) return;
      const year = allYears[step];
      yearLabel.textContent = year;
      focus.selectAll('circle')
        .data(data)
        .attr('cx', d => x(d.values.find(v => v.year === year).year))
        .attr('cy', d => y(d.values.find(v => v.year === year).value));
      step += 1;
    }, 450);
  </script>
</body>
</html>
